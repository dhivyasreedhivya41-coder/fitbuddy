<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #333);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-box {
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 40px;
            border-radius: 15px;
            width: 420px;
            box-shadow: 0 0 30px rgba(255,102,0,0.5);
        }
        h1 { color: #ff6600; text-align: center; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #ff6600;
            color: white;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #e05500; }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>💪 FitBuddy</h1>
        <p style="text-align:center; color:#aaa;">AI-Powered Workout Generator</p>
        <form action="/generate-workout" method="post">
            <input type="text" name="username" placeholder="Name" required>
            <input type="number" name="user_id" placeholder="User ID" required>
            <input type="number" name="age" placeholder="Age" required>
            <input type="number" step="0.1" name="weight" placeholder="Weight (kg)" required>
            <input type="text" name="goal" placeholder="Goal (e.g., weight loss)" required>
            <select name="intensity" required>
                <option value="">Select Intensity</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button type="submit">Generate Plan 🚀</button>
        </form>
    </div>
</body>
</html>
